<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- bootstrap css link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- link css file  -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>CALCULATOR</h1>
    <div class="calculator">
        <div class="first-row">
            <div class="screen">
                <div class="result"></div>
            </div>
            <button class="btn clear">C</button>
        </div>
        <div class="rest-row">
            <!-- first row -->
            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operater">/</button>
        </div>
        <div class="rest-row">
            <!-- second row -->
            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operater">x</button>
        </div>
        <div class="rest-row">
            <!-- third row -->
            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn operater">+</button>
        </div>
        <div class="rest-row">
            <!-- fourth row -->
            <button class="btn number">0</button>
            <button class="btn point">.</button>
            <button class="btn equal">=</button>
            <button class="btn operater">-</button>
        </div>

    </div>


    <script src="./script.js"></script>
    <footer class="calculator-footer">
        <p >
            Built with ❤️ by <b>Arin</b> as part of
            <a href="https://www.theodinproject.com/" target="_blank" rel="noopener noreferrer">
                The Odin Project
            </a>
            
        </p>
        <p>© 2025<span id="current-year"></span> all right reserved.</p>
    </footer>
</body>

</html>
